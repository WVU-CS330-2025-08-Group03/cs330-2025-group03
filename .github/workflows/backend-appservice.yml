name: Build and deploy Node.js app to Azure Web App - LiveWise-api

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: npm install, build, and test (backend only)
        working-directory: backend
        run: |
          npm install
          npm run build --if-present
          # Optional: comment out if you have no tests
          # npm run test --if-present

      - name: Upload backend artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@de617f46172a906d0617bb0e50d81e9e3a5e9b65 # v3
        with:
          app-name: "livewise-api"
          slot-name: "Production"
          package: backend
          publish-profile: ${{ secrets.APP_SERVICE_PUBLISH_PROFILE }}